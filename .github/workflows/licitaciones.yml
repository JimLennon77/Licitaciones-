name: Licitaciones Mercado Público

on:
  # Todos los días ~07:45 hora de Chile (10:45 UTC en horario de verano; 11:45 en invierno)
  schedule:
    - cron: "45 10 * * *"
  # Botón "Run workflow" en la pestaña Actions
  workflow_dispatch:
  # Cada vez que subas un Excel a la carpeta entrada/
  push:
    paths:
      - "entrada/**.xlsx"
      - "entrada/**.xls"

permissions:
  contents: write

concurrency:
  group: licitaciones
  cancel-in-progress: false

jobs:
  exportar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Procesar Excel subidos a entrada/
        run: python scripts/licitaciones.py entrada

      - name: Descargar licitaciones desde la API
        if: github.event_name != 'push'
        env:
          MP_TICKET: ${{ secrets.MP_TICKET }}
        run: python scripts/licitaciones.py api

      - name: Guardar en el repositorio (trazabilidad)
        run: |
          git config user.name "licitaciones-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A datos entrada REGISTRO.md
          if git diff --cached --quiet; then
            echo "Sin cambios."
            exit 0
          fi
          git commit -m "Licitaciones $(TZ=America/Santiago date +'%Y-%m-%d %H:%M') [${{ github.event_name }}]"
          git pull --rebase
          git push
